name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Show publish toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate skills
        run: npm run validate:skills

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: published
        run: |
          if npm view "playwright-ui-smoke-kit@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "playwright-ui-smoke-kit@${{ steps.package.outputs.version }} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "playwright-ui-smoke-kit@${{ steps.package.outputs.version }} is not published yet."
          fi

      - name: Publish dry run
        if: steps.published.outputs.exists != 'true'
        run: npm run publish:dry-run

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public

      - name: Skip npm publish
        if: steps.published.outputs.exists == 'true'
        run: echo "Skipping npm publish because this version already exists."
