name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate skills
        run: npm run validate:skills

      - name: Pack dry run
        run: npm run pack:dry-run

      - name: Publish dry run
        run: npm run publish:dry-run

      - name: README command smoke
        run: npm run test:readme

  fixture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack
        if: matrix.package-manager == 'yarn'
        run: corepack enable

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install kit dependencies
        run: npm ci

      - name: Run fixture smoke
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: npm run test:e2e

  monorepo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install kit dependencies
        run: npm ci

      - name: Run monorepo fixture smoke
        env:
          PACKAGE_MANAGER: npm
          MONOREPO: "1"
        run: npm run test:e2e
